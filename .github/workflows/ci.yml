name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  web:
    name: Web (typecheck, build) and the webhook receiver
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: The sample receiver checks itself against the Standard Webhooks example
        run: node examples/webhook-receiver/receiver.mjs --self-test

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: relayscope:local
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: The image serves the web app, the overlay and the API on an empty database
        run: |
          docker compose up -d --no-build serve
          for i in $(seq 1 30); do curl -sf localhost:8790/api/v1/health >/dev/null && break; sleep 1; done
          curl -sf localhost:8790/api/v1/health | jq -e '.ok == true'
          curl -sf localhost:8790/ | grep -q '<div id="root">'
          curl -sf localhost:8790/config/0x4407765094cc24440154b89368fbb29d7ee629b4127758494b58725fddfd63da/overlay | grep -q '<div id="root">'
          curl -sf localhost:8790/overlay/0x4407765094cc24440154b89368fbb29d7ee629b4127758494b58725fddfd63da | grep -q '<div id="stage"'
          docker run --rm relayscope:local --version
      - name: Container logs
        if: always()
        run: docker compose logs --tail 60
