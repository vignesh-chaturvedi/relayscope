[workspace]
resolver = "3"
members = ["crates/relayscope-core", "crates/relayscope"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.88"
repository = "https://github.com/vignesh-chaturvedi/relayscope"

[workspace.dependencies]
relayscope-core = { path = "crates/relayscope-core" }
borsh = { version = "1.5", features = ["derive"] }
bs58 = "0.5"
hex = "0.4"
sha2 = "0.10"
curve25519-dalek = "4.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
flate2 = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "alloc"] }
rusqlite = { version = "0.43", features = ["bundled", "fallible_uint"] }
zstd = "0.14"
futures = "0.3"
dotenvy = "0.15"
axum = "0.8"
tower-http = { version = "0.6", features = ["fs"] }
tokio-stream = { version = "0.1", features = ["sync"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
gapless = { git = "https://github.com/vignesh-chaturvedi/gapless", rev = "16ca0de955fc19e4bacb79c92b25fe8af10a598e" }
