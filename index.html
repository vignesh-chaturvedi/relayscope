<style>
  :root {
    color-scheme: light dark;
    --bg: #fbfbfa;
    --border: #e3e3df;
    --text: #1b1c1a;
    --muted: #5e605b;
    --accent: #1f6b56;
    --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121412;
      --border: #2f332f;
      --text: #e8e9e5;
      --muted: #a3a69f;
      --accent: #6cc9a9;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.55 var(--font); }
  main { max-width: 1120px; margin: 0 auto; padding: 40px 16px 56px; }
  header { display: flex; align-items: center; gap: 10px; }
  header svg { flex: none; color: var(--accent); }
  h1 { margin: 0; font-size: 26px; line-height: 1.2; letter-spacing: -0.01em; }
  .lede { margin: 8px 0 0; color: var(--muted); max-width: 62ch; }
  video {
    display: block; width: 100%; height: auto; aspect-ratio: 16 / 9;
    margin: 24px 0 20px; background: #000;
    border: 1px solid var(--border); border-radius: 12px;
  }
  nav { display: flex; flex-wrap: wrap; gap: 8px 24px; }
  a { color: var(--accent); text-underline-offset: 3px; }
  a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 2px; }
</style>
